[workspace]
name = "ess-412-512-intro2seismology"
version = "0.1.0"
description = "Introduction to Seismology - Computing labs supplementing Shearer's textbook"
authors = ["Marine Denolle <marinedenolle@uw.edu>"]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11,<3.12"
jupyter = ">=1.0"
jupyterlab = ">=3.0"
matplotlib = ">=3.5"
numpy = ">=1.20"
pandas = ">=1.3"
scipy = ">=1.7"
obspy = ">=1.4"
cartopy = ">=0.20"
ipywidgets = ">=7.6"
seaborn = ">=0.11"
plotly = ">=5.0"
jupyter-book = ">=1.0,<2"
codespell = "*"
pre-commit = "*"
ipykernel = ">=6.0"
h5py = ">=3.0"


[pypi-dependencies]
pykonal = ">=0.4.1"

[feature.graduate]
dependencies = {scikit-learn = ">=1.0", h5py = ">=3.0", netcdf4 = ">=1.5"}

[feature.dev]
dependencies = {black = ">=22.0", pytest = ">=7.0", nbval = ">=0.9"}

[tasks]
# Student tasks
lab = "jupyter lab"
notebook = "jupyter notebook"
test = { cmd = "pytest --nbval notebooks/", depends-on = ["install-dev"] }
format = { cmd = "black notebooks/", depends-on = ["install-dev"] }
check = { cmd = "black --check notebooks/", depends-on = ["install-dev"] }

# Book building tasks
build-book = "jupyter book build ."
serve-book = "python -m http.server --directory _build/html 8000"
build-all = "BASE_URL=/ess-412-512-intro2seismology jupyter book build . && mv _build/html website/book && mkdir -p website/book/img && cp -R lectures/scripts/figures/. website/book/img/ 2>/dev/null || true"
build-ci = "jupyter book build . && mv _build/html website/book && mkdir -p website/book/img && cp -R lectures/scripts/figures/. website/book/img/ 2>/dev/null || true"
serve-all = "python -m http.server --directory website/ 3000"
clean = "rm -rf _build website/book"

# Validation tasks
validate-toc = "python scripts/validate_toc.py"
validate-badges = "python scripts/check_colab_badges.py"
validate-whitespace = "pre-commit run trailing-whitespace --all-files"
validate-eof = "pre-commit run end-of-file-fixer --all-files"
spellcheck = "codespell --skip './_build,./website,pixi.lock,*.ipynb,*.js,*.css,*.map,*.svg,*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.eot,*.ttf,*.woff,*.woff2' --ignore-words-list='hist,nd,te,ba'"
linkcheck = "jupyter-book build --builder linkcheck ."
validate = { cmd = "pre-commit run --all-files && pixi run spellcheck && pixi run build-ci && pixi run linkcheck", depends-on = ["install-dev"] }

# Pre-commit workflow (run before committing changes)
precommit = { cmd = "python scripts/validate_toc.py && python scripts/check_colab_badges.py && jupyter-book build .", depends-on = ["install-dev"] }

[tasks.install-dev]
cmd = "echo 'Dev dependencies installed'"
depends-on = []

[environments]
default = { solve-group = "default" }
graduate = { features = ["graduate"], solve-group = "default" }
dev = { features = ["graduate", "dev"], solve-group = "default" }

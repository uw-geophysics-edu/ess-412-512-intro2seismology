name: Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /ess-412-512-intro2seismology

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          cache: true
          frozen: true
      
      - name: Validate TOC file references
        run: pixi run validate-toc
      
      - name: Check Colab badges in notebooks
        run: pixi run validate-badges
      
      - name: Spellcheck
        run: pixi run spellcheck
      
      - name: Build book
        run: pixi run build-ci
      
      - name: Linkcheck
        continue-on-error: true
        run: pixi run linkcheck
      
      - name: Check website directory
        run: |
          ls -la website/
          du -sh website/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'website'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
